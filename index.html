<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Good night</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% 120%,#2a2350 0%,#0d1030 45%,#05060f 100%);font-family:Georgia,'Times New Roman',serif;color:#f3eefc;user-select:none;-webkit-user-select:none}
#glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 110%,rgba(170,110,210,.45),transparent 65%);opacity:0;transition:opacity 3s;pointer-events:none}
body.done #glow{opacity:1}
.dot{position:absolute;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
#moon{position:absolute;top:28px;right:28px;width:84px;height:84px;border-radius:50%;background:rgba(255,248,220,.1);border:1px solid rgba(255,248,220,.35);overflow:hidden}
#fill{position:absolute;bottom:0;left:0;right:0;height:0;background:#fff3c4;transition:height .6s ease}
#moon.full{box-shadow:0 0 60px rgba(255,243,196,.6)}
#count{position:absolute;top:122px;right:28px;width:84px;text-align:center;font-size:14px;opacity:.7}
#msg{position:absolute;left:0;right:0;bottom:12%;text-align:center;padding:0 24px;font-size:20px;font-style:italic;opacity:0;transition:opacity .8s;pointer-events:none}
#msg.show{opacity:1}
.star{position:absolute;top:-60px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#ffe9a8;text-shadow:0 0 12px #ffd76a,0 0 26px #ffb84d;cursor:pointer;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 120px)) rotate(200deg)}}
.burst{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px #ffd76a;pointer-events:none;animation:pop .7s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);text-align:center;padding:30px 24px;border-radius:22px;background:rgba(20,18,50,.65);border:1px solid rgba(255,255,255,.15);transition:opacity 1.2s}
.card h1{font-weight:normal;font-size:28px;margin-bottom:12px}
.card p{line-height:1.6;font-size:17px;opacity:.9}
.from{margin-top:12px;font-style:italic;opacity:.7}
.hidden{opacity:0;pointer-events:none}
button{margin-top:18px;padding:13px 28px;border-radius:999px;border:1px solid rgba(255,233,168,.6);background:rgba(255,233,168,.12);color:#ffe9a8;font-family:inherit;font-size:16px;cursor:pointer}
.lbl{margin-top:20px;font-size:15px;opacity:.8;text-align:left}
textarea{width:100%;margin-top:8px;height:84px;resize:none;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#f3eefc;font-family:inherit;font-size:16px;padding:10px 12px;outline:none;user-select:text;-webkit-user-select:text}
textarea::placeholder{color:rgba(243,238,252,.45)}
#err{font-size:13px;color:#fca5a5;text-align:left;margin-top:6px;min-height:16px}
.wa{width:100%;margin-top:4px;background:rgba(37,211,102,.16);border-color:rgba(37,211,102,.6);color:#bbf7d0}
.shoot{position:absolute;width:170px;height:2px;background:linear-gradient(90deg,transparent,#fff);top:15%;left:-220px;transform:rotate(-18deg);animation:shoot 1.4s ease-out forwards;pointer-events:none}
@keyframes shoot{to{left:110%;top:40%;opacity:0}}
</style>
</head>
<body>
<div id="glow"></div>
<div id="moon"><div id="fill"></div></div>
<div id="count"></div>
<div id="msg"></div>

<div id="start" class="card">
  <h1>Hey <span class="name"></span></h1>
  <p>Before you sleep, catch 10 falling stars for me. Tap them as they drift down.</p>
  <button id="go">Start</button>
</div>

<div id="end" class="card hidden">
  <h1>Good night, <span class="name"></span></h1>
  <p id="note"></p>
  <p class="from" id="from"></p>
  <button id="wish">Make a wish</button>
  <div class="lbl">Send Kendrick a message</div>
  <textarea id="txt" placeholder="Type something…"></textarea>
  <div id="err"></div>
  <button class="wa" id="send">Send</button>
</div>

<script>
// ===== Change these =====
const HER_NAME = "Lizzie";
const FROM     = "Kendrick";
const NOTE     = "Sweet Dreams. Rest well.";
const PHONE    = "256760506463"; // 0760 506 463 in international format, no + or spaces
const LINES = [
  "You made it through today. That's enough.",
  "Let your shoulders drop.",
  "Whatever didn't get done can wait.",
  "Someone is thinking about you right now.",
  "You were on my mind today.",
  "Breathe in slowly... and out.",
  "The stars came out just for you tonight.",
  "You don't have to earn rest.",
  "Life is Precious.",
  "Time to close your eyes."
];
// ========================

const GOAL = LINES.length;
const $ = id => document.getElementById(id);
document.querySelectorAll('.name').forEach(e => e.textContent = HER_NAME);
$('note').textContent = NOTE;
$('from').textContent = FROM;

for (let i = 0; i < 140; i++) {
  const d = document.createElement('div');
  const s = 1 + Math.random() * 1.8;
  d.className = 'dot';
  d.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  document.body.prepend(d);
}

let caught = 0, playing = false, timer = null, msgTimer = null;

$('go').onclick = () => {
  $('start').classList.add('hidden');
  playing = true;
  updateCount();
  spawn();
  timer = setInterval(spawn, 1100);
};

function spawn() {
  if (!playing) return;
  const s = document.createElement('div');
  s.className = 'star';
  s.textContent = '★';
  s.style.left = Math.random() * (innerWidth - 60) + 'px';
  s.style.animationDuration = (6 + Math.random() * 3) + 's';
  s.addEventListener('pointerdown', () => catchStar(s));
  s.addEventListener('animationend', () => s.remove());
  document.body.appendChild(s);
}

function catchStar(s) {
  if (!playing) return;
  const r = s.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
  s.remove();
  caught++;
  $('fill').style.height = (caught / GOAL * 100) + '%';
  updateCount();
  say(LINES[caught - 1]);
  if (caught >= GOAL) finish();
}

function burst(x, y) {
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 50;
    b.className = 'burst';
    b.style.left = x + 'px';
    b.style.top = y + 'px';
    b.style.setProperty('--x', Math.cos(a) * d + 'px');
    b.style.setProperty('--y', Math.sin(a) * d + 'px');
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 800);
  }
}

function say(text) {
  const m = $('msg');
  m.textContent = text;
  m.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => m.classList.remove('show'), 3200);
}

function updateCount() { $('count').textContent = caught + ' / ' + GOAL; }

function finish() {
  playing = false;
  clearInterval(timer);
  $('moon').classList.add('full');
  document.querySelectorAll('.star').forEach(s => {
    s.style.transition = 'opacity 1s';
    s.style.opacity = 0;
    setTimeout(() => s.remove(), 1000);
  });
  document.body.classList.add('done');
  setTimeout(() => {
    $('msg').classList.remove('show');
    $('count').textContent = '';
    $('end').classList.remove('hidden');
  }, 3600);
}

$('wish').onclick = () => {
  const s = document.createElement('div');
  s.className = 'shoot';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 1500);
  $('wish').textContent = 'Sweet dreams';
};

$('txt').oninput = () => { $('err').textContent = ''; };

$('send').onclick = () => {
  const text = $('txt').value.trim();
  if (!text) { $('err').textContent = 'Write something first.'; return; }
  window.location.href = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(text);
};
</script>
</body>
</html>
